<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0b0b12" />
<title>Notemaker</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon.png" />
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0b12;
    --panel: #16161f;
    --panel2: #1e1e2a;
    --accent: #7c6cff;
    --danger: #ff5c5c;
    --text: #f0f0f5;
    --muted: #9a9aab;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    height: 100%;
  }
  #app { display: flex; flex-direction: column; height: 100dvh; }
  header {
    padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
    display: flex; align-items: center; justify-content: space-between;
    background: var(--panel); border-bottom: 1px solid #262633;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header h1 .build { font-size: 11px; font-weight: 400; color: var(--muted); vertical-align: middle; }
  .icon-btn {
    background: none; border: none; color: var(--muted); font-size: 20px;
    padding: 6px; cursor: pointer;
  }
  main { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 140px; }
  .empty { color: var(--muted); text-align: center; margin-top: 60px; font-size: 15px; }
  .note-card {
    background: var(--panel); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px;
    border: 1px solid #23232f;
  }
  .note-card .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .note-card .title { font-weight: 600; font-size: 15px; margin-bottom: 6px; }
  .note-card .snippet {
    font-size: 15px; color: #d4d4de; line-height: 1.55; white-space: pre-wrap;
    overflow-wrap: anywhere; margin-bottom: 4px;
  }
  .note-card.live .snippet { font-size: 16px; color: var(--text); }
  .note-card .status { font-size: 12px; color: var(--accent); }
  .note-card.live { border-color: var(--danger); }
  .live-status { display: flex; align-items: center; gap: 6px; color: var(--danger) !important; margin-bottom: 6px; }
  .live-status .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--danger);
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  .note-card .del { color: var(--danger); background: none; border: none; font-size: 13px; padding: 4px 0; margin-top: 8px; cursor: pointer; }
  footer {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 14px 16px calc(env(safe-area-inset-bottom) + 14px);
    background: linear-gradient(to top, var(--bg) 60%, transparent);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  #timer { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 20px; }
  #recordBtn {
    width: 76px; height: 76px; border-radius: 50%; border: 4px solid #3a3a4a;
    background: var(--danger); cursor: pointer; position: relative;
  }
  #recordBtn.recording { background: var(--panel2); }
  #recordBtn.recording::after {
    content: ""; position: absolute; inset: 26px; background: var(--danger); border-radius: 6px;
  }
  #recordBtn:not(.recording)::after {
    content: ""; position: absolute; inset: 8px; background: var(--danger); border-radius: 50%;
  }
  .hint { font-size: 12px; color: var(--muted); max-width: 280px; text-align: center; }

  /* Settings modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: flex-end;
    z-index: 20;
  }
  .modal {
    background: var(--panel); width: 100%; border-radius: 20px 20px 0 0;
    padding: 20px 20px calc(env(safe-area-inset-bottom) + 20px);
  }
  .modal h2 { margin: 0 0 14px; font-size: 17px; }
  .modal label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }
  .modal input, .modal textarea {
    width: 100%; background: var(--panel2); border: 1px solid #2c2c3a; border-radius: 10px;
    color: var(--text); padding: 10px 12px; font-size: 14px; margin-bottom: 14px;
  }
  .modal .row { display: flex; gap: 10px; }
  .modal button.primary {
    flex: 1; background: var(--accent); color: white; border: none; border-radius: 10px;
    padding: 12px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .modal button.secondary {
    flex: 1; background: var(--panel2); color: var(--text); border: none; border-radius: 10px;
    padding: 12px; font-size: 15px; cursor: pointer;
  }
  .modal p.note { font-size: 12px; color: var(--muted); margin-top: -6px; margin-bottom: 14px; }

  /* Detail view */
  .detail-backdrop {
    position: fixed; inset: 0; background: var(--bg); z-index: 15; display: flex; flex-direction: column;
  }
  .detail-header {
    padding: calc(env(safe-area-inset-top) + 12px) 16px 12px; display: flex; align-items: center; gap: 12px;
    background: var(--panel); border-bottom: 1px solid #262633;
  }
  .detail-header button { background: none; border: none; color: var(--accent); font-size: 16px; cursor: pointer; }
  .detail-body { padding: 16px; overflow-y: auto; white-space: pre-wrap; line-height: 1.6; font-size: 15px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🎙️ Notemaker <span class="build">gemini·v6</span></h1>
    <div>
      <button class="icon-btn" id="clearBtn" title="Delete all notes">🗑️</button>
      <button class="icon-btn" id="settingsBtn">⚙️</button>
    </div>
  </header>
  <main id="notesList"></main>
  <footer>
    <div id="timer"></div>
    <button id="recordBtn" aria-label="Record"></button>
    <div class="hint">Keep this tab open &amp; screen unlocked while recording. For calls, use speakerphone.</div>
  </footer>
</div>

<script>
const STORAGE_KEY = 'notemaker_notes_v1';
const APIKEY_KEY = 'notemaker_gemini_key';

let notes = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let mediaRecorder, chunks = [], stream, startTime, timerInterval;
let wakeLock = null;
let recording = false;
let activeNoteId = null;
let segmentTimer = null;

// Audio is captured in short segments so each one can be transcribed while the
// meeting is still running, instead of waiting for the whole recording to end.
const SEGMENT_MS = 15000;

const notesList = document.getElementById('notesList');
const recordBtn = document.getElementById('recordBtn');
const timerEl = document.getElementById('timer');
const settingsBtn = document.getElementById('settingsBtn');

function saveNotes() { localStorage.setItem(STORAGE_KEY, JSON.stringify(notes)); }

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

// Segments arrive out of order, so always read them back by index.
function noteText(n) {
  if (n.segments && n.segments.length) {
    return n.segments.filter((s) => s).join(' ').trim();
  }
  return n.transcript || '';
}

function renderNotes() {
  if (notes.length === 0) {
    notesList.innerHTML = '<div class="empty">No notes yet.<br>Tap the red button to start recording.</div>';
    return;
  }
  notesList.innerHTML = notes.slice().reverse().map(n => {
    const live = n.status === 'recording';
    const text = noteText(n);
    return `
    <div class="note-card ${live ? 'live' : ''}" data-id="${n.id}">
      <div class="meta"><span>${new Date(n.createdAt).toLocaleString()}</span><span>${n.duration || ''}</span></div>
      <div class="title">${n.title || 'Meeting note'}</div>
      ${live ? '<div class="status live-status"><span class="dot"></span>Recording — live transcript</div>' :
        n.status === 'transcribing' ? '<div class="status">Transcribing…</div>' :
        n.status === 'error' ? `<div class="status" style="color:var(--danger)">Couldn't transcribe: ${escapeHtml(n.error)}</div>` : ''}
      <div class="snippet">${escapeHtml(text) || (live
        ? '<span style="color:var(--muted)">Listening…</span>'
        : '<span style="color:var(--muted)">(no text)</span>')}</div>
      <button class="del" data-id="${n.id}">Delete</button>
    </div>
  `;
  }).join('');
}

notesList.addEventListener('click', (e) => {
  if (e.target.classList.contains('del')) {
    const id = e.target.dataset.id;
    // Deleting the note being recorded has to stop the recording too.
    if (id === activeNoteId && recording) stopRecording();
    notes = notes.filter(n => n.id !== id);
    if (id === activeNoteId) activeNoteId = null;
    saveNotes(); renderNotes();
    return;
  }
  const card = e.target.closest('.note-card');
  if (card) openDetail(card.dataset.id);
});

function openDetail(id) {
  const n = notes.find(x => x.id === id);
  if (!n) return;
  const el = document.createElement('div');
  el.className = 'detail-backdrop';
  el.innerHTML = `
    <div class="detail-header">
      <button id="closeDetail">← Back</button>
      <strong>${escapeHtml(n.title || 'Meeting note')}</strong>
    </div>
    <div class="detail-body">${n.status === 'error' ? 'Error: ' + escapeHtml(n.error) : (escapeHtml(noteText(n)) || '(empty)')}</div>
  `;
  document.body.appendChild(el);
  el.querySelector('#closeDetail').onclick = () => el.remove();
}

// --- Clear all ---
document.getElementById('clearBtn').onclick = () => {
  if (!notes.length) return;
  const failed = notes.filter((n) => n.status === 'error').length;
  const msg = failed
    ? `Delete all ${notes.length} note(s), including ${failed} failed one(s)?`
    : `Delete all ${notes.length} note(s)? This cannot be undone.`;
  if (!confirm(msg)) return;
  if (recording) stopRecording();
  notes = [];
  activeNoteId = null;
  saveNotes(); renderNotes();
};

// --- Settings ---
settingsBtn.onclick = () => {
  const key = localStorage.getItem(APIKEY_KEY) || '';
  const el = document.createElement('div');
  el.className = 'modal-backdrop';
  el.innerHTML = `
    <div class="modal">
      <h2>Settings</h2>
      <label>Gemini API Key (used for transcription)</label>
      <input type="password" id="apiKeyInput" placeholder="AIza..." value="${key}" autocapitalize="off" autocorrect="off" />
      <p class="note">Stored only in this browser (localStorage). Never sent anywhere except Google's Gemini API directly from your device. Get a key at aistudio.google.com/apikey.</p>
      <div class="row">
        <button class="secondary" id="cancelSettings">Cancel</button>
        <button class="primary" id="saveSettings">Save</button>
      </div>
    </div>
  `;
  document.body.appendChild(el);
  el.querySelector('#cancelSettings').onclick = () => el.remove();
  el.querySelector('#saveSettings').onclick = () => {
    localStorage.setItem(APIKEY_KEY, el.querySelector('#apiKeyInput').value.trim());
    el.remove();
  };
};

// --- Recording ---
recordBtn.onclick = async () => {
  if (recording) { stopRecording(); return; }

  const apiKey = localStorage.getItem(APIKEY_KEY);
  if (!apiKey) {
    alert('Please set your Gemini API key in Settings (⚙️) first.');
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) {
    alert('Microphone access denied: ' + err.message);
    return;
  }
  try {
    if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
  } catch (e) {}

  const mimeType = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : 'audio/webm';

  activeNoteId = Date.now().toString();
  notes.push({
    id: activeNoteId,
    createdAt: Date.now(),
    duration: '0:00',
    status: 'recording',
    title: 'Meeting note',
    segments: [],
  });
  saveNotes(); renderNotes();

  recording = true;
  startTime = Date.now();
  recordBtn.classList.add('recording');
  timerInterval = setInterval(() => {
    const secs = Math.round((Date.now() - startTime) / 1000);
    timerEl.textContent = formatDuration(secs);
    const note = notes.find((n) => n.id === activeNoteId);
    if (note) note.duration = formatDuration(secs);
  }, 500);

  // Warm the model choice up front so the first segment isn't delayed by it.
  resolveModel(apiKey);
  startSegment(mimeType, apiKey);
};

function startSegment(mimeType, apiKey) {
  if (!recording) return;

  chunks = [];
  mediaRecorder = new MediaRecorder(stream, { mimeType });
  const note = notes.find((n) => n.id === activeNoteId);
  const segIndex = note ? note.segments.length : 0;
  if (note) note.segments.push(null); // null = still transcribing

  mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
  mediaRecorder.onstop = () => {
    const blob = new Blob(chunks, { type: mimeType });
    const wasLast = !recording;

    // Each segment is a standalone file, so it can be transcribed on its own.
    if (blob.size > 0) {
      transcribeSegment(blob, mimeType, activeNoteId, segIndex, apiKey, wasLast);
    } else if (wasLast) {
      finalizeNote(activeNoteId);
    }

    if (recording) startSegment(mimeType, apiKey);
  };

  mediaRecorder.start();
  segmentTimer = setTimeout(() => {
    if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
  }, SEGMENT_MS);
}

function stopRecording() {
  recording = false;
  clearTimeout(segmentTimer);
  clearInterval(timerInterval);
  timerEl.textContent = '';
  recordBtn.classList.remove('recording');

  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
  } else {
    finalizeNote(activeNoteId);
  }
  if (stream) stream.getTracks().forEach((t) => t.stop());
  if (wakeLock) { wakeLock.release(); wakeLock = null; }
}

function finalizeNote(id) {
  const note = notes.find((n) => n.id === id);
  if (!note) return;
  const pending = (note.segments || []).some((s) => s === null);
  note.status = pending ? 'transcribing' : 'done';
  const text = noteText(note);
  if (text) note.title = text.split(/[.!?\n]/)[0].slice(0, 60) || 'Meeting note';
  saveNotes(); renderNotes();
}

function formatDuration(sec) {
  const m = Math.floor(sec / 60), s = sec % 60;
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

const MODEL_KEY = 'notemaker_model';
const FALLBACK_MODELS = ['gemini-flash-latest', 'gemini-3.6-flash', 'gemini-3.5-flash'];

// Model names get retired over time, so ask the API which ones this key can
// actually use rather than pinning one that will eventually 404.
async function resolveModel(apiKey) {
  const cached = localStorage.getItem(MODEL_KEY);
  if (cached) return cached;

  let picked = FALLBACK_MODELS[0];
  try {
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(apiKey)}&pageSize=200`
    );
    if (res.ok) {
      const { models = [] } = await res.json();
      const usable = models
        .filter((m) => (m.supportedGenerationMethods || []).includes('generateContent'))
        .map((m) => m.name.replace(/^models\//, ''))
        .filter((n) => /flash/.test(n) && !/(image|tts|embedding|live|dialog|vision)/.test(n));
      if (usable.length) {
        const score = (n) => {
          const v = parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/) || [])[1] || '0');
          return v * 100 - (/preview|exp/.test(n) ? 50 : 0) - (/lite/.test(n) ? 10 : 0);
        };
        usable.sort((a, b) => score(b) - score(a));
        picked = usable[0];
      }
    }
  } catch (e) {
    /* fall through to default */
  }
  localStorage.setItem(MODEL_KEY, picked);
  return picked;
}

async function callGemini(model, apiKey, base64Audio, mimeType) {
  return fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`,
    {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{
          parts: [
            { text: 'Transcribe this audio recording verbatim. Return only the transcript text, no commentary.' },
            { inlineData: { mimeType, data: base64Audio } },
          ],
        }],
      }),
    }
  );
}

async function transcribeSegment(blob, mimeType, id, segIndex, apiKey, isLast) {
  try {
    const base64Audio = await blobToBase64(blob);
    let model = await resolveModel(apiKey);
    let res = await callGemini(model, apiKey, base64Audio, mimeType);

    // A retired model returns 404 - drop the cached choice, re-discover, retry once.
    if (res.status === 404) {
      localStorage.removeItem(MODEL_KEY);
      model = await resolveModel(apiKey);
      res = await callGemini(model, apiKey, base64Audio, mimeType);
    }

    if (!res.ok) {
      const errText = await res.text();
      throw new Error(`API error ${res.status} (model ${model}): ${errText.slice(0, 200)}`);
    }
    const data = await res.json();
    const text = (data.candidates?.[0]?.content?.parts?.map((p) => p.text || '').join('') || '').trim();
    const note = notes.find((n) => n.id === id);
    if (note) note.segments[segIndex] = text;
  } catch (err) {
    const note = notes.find((n) => n.id === id);
    if (note) {
      note.segments[segIndex] = '';
      note.error = err.message;
      // Surface the failure only if nothing at all was captured.
      if (!noteText(note)) note.status = 'error';
    }
  }

  const note = notes.find((n) => n.id === id);
  const stillPending = note && (note.segments || []).some((s) => s === null);
  if (note && !recording && !stillPending && note.status !== 'error') {
    finalizeNote(id);
  } else {
    saveNotes(); renderNotes();
  }
}

// A recording interrupted by a reload can't be resumed - don't leave it "live".
notes.forEach((n) => {
  if (n.status === 'recording' || n.status === 'transcribing') {
    n.segments = (n.segments || []).map((s) => (s === null ? '' : s));
    n.status = noteText(n) ? 'done' : 'error';
    if (n.status === 'error' && !n.error) n.error = 'Recording interrupted';
  }
});
saveNotes();

renderNotes();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker
    .register('sw.js', { updateViaCache: 'none' })
    .then((reg) => reg.update())
    .catch(() => {});
}
</script>
</body>
</html>
